[project]
name = "selfplay-task19-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.10.0", "transformers==5.13.0", "peft==0.19.1",
    "pydantic==2.12.3", "numpy==1.26.4", "pyyaml==6.0.3",
    "evalplus==0.3.1", "httpx==0.28.1", "wandb==0.22.2",
    "pyarrow==21.0.0", "scipy==1.16.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "torch-cu128" }

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
